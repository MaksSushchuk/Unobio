[project]
name = "researcher"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "google-genai>=1.0",
    "python-dotenv>=1.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# PDF report: the writer is a separate package in ./writer -> uv pip install -e ./writer

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["evidence_bundle*", "analytics*", "researcher*", "writer*", "sceptic*", "app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "live: hits a real public API",
    "llm: calls the Gemini API (skipped when GEMINI_API_KEY is unset)",
]
