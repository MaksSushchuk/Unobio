[project]
name = "unobio-server"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "google-genai>=1.0",
    "python-dotenv>=1.0",
    "reportlab>=4.0",  # writer PDF
]

[project.optional-dependencies]
dev = ["pytest>=8", "pypdf>=4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["evidence_bundle*", "analytics*", "researcher*", "orchestrator*"]  # writer_agent: pip install -e ./writer

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "live: hits a real public API",
    "llm: calls the Gemini API (skipped when GEMINI_API_KEY is unset)",
]
